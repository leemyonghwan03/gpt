name: document-writer-v091-windows-verify

on:
  push:
    branches:
      - document-writer-v091-win-verify-20260825
  workflow_dispatch:

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Reconstruct full v0.9.1 source
        shell: pwsh
        run: |
          $b64 = Get-Content "document-writer-v091/source.zip.b64" -Raw
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("$PWD\document-writer-v091-source.zip", $bytes)
          Expand-Archive "$PWD\document-writer-v091-source.zip" "$PWD\document-writer-v091-src" -Force

      - name: Install dependencies
        working-directory: document-writer-v091-src
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-poc.txt

      - name: Full source tests
        working-directory: document-writer-v091-src
        shell: pwsh
        run: |
          python -m pytest -q
          python -c "from companion.service import CompanionDocumentService; from pathlib import Path; from zipfile import ZipFile; p=Path('runtime_link_gate.hwpx'); z=ZipFile(p,'w'); z.writestr('random.xml','<root/>'); z.close(); d=CompanionDocumentService().link(p); assert d.format=='HWPX'; print('LINK_WITHOUT_PARSE_RUNTIME=PASS')"

      - name: Build full project Windows EXE
        working-directory: document-writer-v091-src
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean packaging\companion_windows.spec
          if (-not (Test-Path "dist\DocumentAssistant\DocumentAssistant.exe")) { throw "DocumentAssistant.exe missing" }

      - name: Run packaged EXE self-test
        working-directory: document-writer-v091-src
        shell: pwsh
        run: |
          $env:DOCUMENT_WRITER_SELFTEST = "1"
          $exe = Join-Path $PWD "dist\DocumentAssistant\DocumentAssistant.exe"
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            $log = Join-Path (Split-Path $exe) "runtime_data\logs\companion_startup.log"
            if (Test-Path $log) { Get-Content $log -Tail 250 }
            throw "Packaged EXE self-test failed: $($proc.ExitCode)"
          }

      - name: Verify full-project link regression markers
        working-directory: document-writer-v091-src
        shell: pwsh
        run: |
          $marker = "dist\DocumentAssistant\WINDOWS_SELFTEST_PASS.txt"
          if (-not (Test-Path $marker)) { throw "Self-test marker missing" }
          $text = Get-Content $marker -Raw
          $required = @(
            "WINDOWS_SELFTEST=PASS",
            "VERSION=0.9.1",
            "FROZEN=True",
            "FULL_PROJECT_BUILD=PASS",
            "LINK_WITHOUT_PARSE=PASS",
            "FORMAT_DETECTOR=PASS",
            "HWPX_PARSE=PASS",
            "HWPX_TEMPLATE_WRITE=PASS",
            "NEW_DOCUMENT_AUTOLINK_CODEPATH=PASS",
            "TABLE_AUTO_FORMAT_CODEPATH=PASS"
          )
          foreach ($value in $required) {
            if (-not $text.Contains($value)) { throw "Missing marker: $value" }
          }
          Get-Content $marker

      - name: Archive verified Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            "$PWD\document-writer-v091-src\dist\DocumentAssistant\*" `
            "$PWD\DocumentAssistant-v0.9.1-Windows-x64-VERIFIED.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DocumentAssistant-v0.9.1-Windows-x64-VERIFIED
          path: DocumentAssistant-v0.9.1-Windows-x64-VERIFIED.zip
          if-no-files-found: error
