name: document-writer-windows-v08

on:
  push:
    branches:
      - document-writer-win-verify-20260825
  workflow_dispatch:

jobs:
  verify-windows-v08:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Rebuild v0.8 source
        working-directory: document-writer-win-v08
        shell: pwsh
        run: |
          $chunks = @('chunk_00.txt','chunk_01.txt','chunk_02.txt','chunk_03.txt','chunk_04.txt','chunk_05.txt')
          $content = ''
          foreach ($c in $chunks) { $content += Get-Content $c -Raw }
          [IO.File]::WriteAllText((Join-Path $PWD 'companion_v08.py'), $content, [Text.UTF8Encoding]::new($false))
          python -m py_compile companion_v08.py
          Write-Host 'SOURCE_REBUILD=PASS'

      - name: Install Windows dependencies
        working-directory: document-writer-win-v08
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import tkinter,lxml,win32gui,win32com.client,pythoncom,pywinauto; print('WINDOWS_IMPORTS=PASS')"
          python -c "from companion_v08 import ACTION_COUNT,READY_ACTION_COUNT; assert ACTION_COUNT == 32; assert READY_ACTION_COUNT >= 18; print('ACTION_PANEL=PASS', ACTION_COUNT, READY_ACTION_COUNT)"

      - name: Python v0.8 self-test
        working-directory: document-writer-win-v08
        shell: pwsh
        run: |
          python companion_v08.py --selftest
          if (-not (Test-Path WINDOWS_SELFTEST_PASS.txt)) { throw 'Python self-test marker missing' }
          Get-Content WINDOWS_SELFTEST_PASS.txt
          $t = Get-Content WINDOWS_SELFTEST_PASS.txt -Raw
          if ($t -notmatch 'ACTION_COUNT=32') { throw '32 action panel not verified' }
          if ($t -notmatch 'HWPX_TEMPLATE_WRITE=PASS') { throw 'HWPX writer self-test missing' }
          if ($t -notmatch 'HWPX_BATCH_REPLACE=PASS') { throw 'batch replace self-test missing' }
          Remove-Item WINDOWS_SELFTEST_PASS.txt

      - name: Build Windows onedir EXE
        working-directory: document-writer-win-v08
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name DocumentAssistant `
            --hidden-import=pythoncom `
            --hidden-import=pywintypes `
            --hidden-import=win32api `
            --hidden-import=win32con `
            --hidden-import=win32gui `
            --hidden-import=win32process `
            --collect-all=lxml `
            --collect-all=pywinauto `
            companion_v08.py
          if (-not (Test-Path dist\DocumentAssistant\DocumentAssistant.exe)) { throw 'EXE build missing' }

      - name: Packaged EXE v0.8 self-test
        working-directory: document-writer-win-v08
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist\DocumentAssistant\DocumentAssistant.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -WorkingDirectory 'dist\DocumentAssistant' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path 'dist\DocumentAssistant\WINDOWS_STARTUP_ERROR.txt') { Get-Content 'dist\DocumentAssistant\WINDOWS_STARTUP_ERROR.txt' }
            throw "Packaged EXE self-test failed: $($proc.ExitCode)"
          }
          if (-not (Test-Path 'dist\DocumentAssistant\WINDOWS_SELFTEST_PASS.txt')) { throw 'Packaged EXE self-test marker missing' }
          $t = Get-Content 'dist\DocumentAssistant\WINDOWS_SELFTEST_PASS.txt' -Raw
          Write-Host $t
          if ($t -notmatch 'FROZEN=True') { throw 'EXE frozen runtime not verified' }
          if ($t -notmatch 'ACTION_COUNT=32') { throw 'EXE 32 action panel not verified' }
          if ($t -notmatch 'HWPX_PARSE=PASS') { throw 'EXE HWPX parse failed' }
          if ($t -notmatch 'HWPX_TEMPLATE_WRITE=PASS') { throw 'EXE HWPX template write failed' }
          if ($t -notmatch 'HWPX_BATCH_REPLACE=PASS') { throw 'EXE HWPX batch replace failed' }
          if ($t -notmatch 'SOURCE_GUARD=PASS') { throw 'EXE source guard failed' }

      - name: Archive verified v0.8 build
        working-directory: document-writer-win-v08
        shell: pwsh
        run: |
          Compress-Archive 'dist\DocumentAssistant\*' 'DocumentAssistant-v0.8-Windows-x64-VERIFIED.zip' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DocumentAssistant-v0.8-Windows-x64-VERIFIED
          path: document-writer-win-v08/DocumentAssistant-v0.8-Windows-x64-VERIFIED.zip
          if-no-files-found: error
